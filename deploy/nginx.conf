# ============================================================================
# 暖阳邻里 · 静态站点 Nginx 配置（HTTP + HTTPS 双 server 块）
# ----------------------------------------------------------------------------
# 适用：Nginx >= 1.18（Debian/Ubuntu 的 nginx 包或 RHEL 系均可）
# 落盘：/etc/nginx/conf.d/linli.conf
# 生效：sudo nginx -t && sudo systemctl reload nginx
#
# 域名：linli.lzbdcxm.cn（A 记录 → 62.234.23.197，DNSPod，RecordId 2440115145）
# 证书：Let's Encrypt，certbot 1.21.0，到期 2027-01-28，certbot.timer 自动续期
#
# ----------------------------------------------------------------------------
# 为什么拆成两个 server 块（2026-10-30 重构，改动前必须读懂）
# ----------------------------------------------------------------------------
# certbot --nginx 默认会把 443 的 listen/证书指令，连同下面这段一起塞进 80 块：
#     if ($host = <域名>) { return 301 https://$host$request_uri; }
# 而 nginx 的 server 级 if 属于 rewrite 阶段，执行顺序**先于 location 匹配**。
# 于是 /.well-known/acme-challenge/ 的校验请求先被 301 到 HTTPS，HTTP-01 挑战
# 拿不到 token，`certbot renew` 必然失败——90 天后证书过期，站点直接告警。
#
# 实测证据（2026-10-30）：
#     certbot renew --dry-run
#     → Unable to update challenge :: authorization must be pending
#
# 因此本文件的结构约束是：
#   1. 80 块只做两件事——放行 ACME 校验、301 跳转到 HTTPS，不含任何业务配置。
#   2. 跳转必须用 location 级 return，不得用 server 级 if。
#   3. 续期认证方式固定 webroot（/etc/letsencrypt/renewal/*.conf 内
#      authenticator = webroot，webroot_path = /var/www/certbot），
#      不再让 certbot 改写本文件。
#
# 与构建产物强相关的前提（改动前请先读懂，否则会出现白屏或版本不生效）：
#
#   1. vite.config.ts 未设置 base，产物引用绝对路径 /assets/*。
#      => 站点必须部署在域名根目录。若必须放子目录（如 /linli/），
#         需先在 vite.config.ts 增加 base: "/linli/" 并重新构建。
#   2. 双入口：index.html（B 端）、aplus.html（A+ 端），两者文件名都不含哈希。
#      => 必须 no-cache，否则发版后用户仍拿到旧 HTML，指向已被删除的旧 chunk。
#   3. /assets/* 文件名含内容哈希（如 community-UgQB5uMf.js）。
#      => 可安全使用 1 年 immutable 缓存，发版无需换名。
#   4. 路由全部走查询串（?tab=community&post=<id>），不使用 history 路由。
#      => 不需要 SPA fallback 重写。任何形如 try_files $uri /index.html 的
#         兜底都会把 404 伪装成 200，反而掩盖真实错误，故此处刻意不写。
#   5. 本项目为合成数据演练原型，HTML 已含 meta robots=noindex，
#      public/robots.txt 为第二道闸门；此处 X-Robots-Tag 为第三道。
# ============================================================================

# ----------------------------------------------------------------------------
# 80：仅承担 ACME 校验与跳转
# 注意：此处不得出现 root / add_header / try_files 等业务指令，
#       一旦引入就等于给 HTTP 明文留了一条旁路。
# ----------------------------------------------------------------------------
server {
    listen      80;
    listen      [::]:80;
    server_name linli.lzbdcxm.cn;

    charset utf-8;

    # ACME 校验放行。^~ 前缀匹配优先级高于下面的 location /，
    # 保证挑战请求不会被 301 吞掉。
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        access_log off;
    }

    # 其余一律跳 HTTPS。
    location / {
        return 301 https://$host$request_uri;
    }
}

# ----------------------------------------------------------------------------
# 443：承载全部业务配置
# ----------------------------------------------------------------------------
server {
    listen      443 ssl http2;
    listen      [::]:443 ssl http2;
    server_name linli.lzbdcxm.cn;

    root  /var/www/linli;
    index index.html;
    charset utf-8;

    access_log /var/log/nginx/linli.access.log;
    error_log  /var/log/nginx/linli.error.log warn;

    # ---- TLS（证书由 certbot 维护，勿手改路径）----------------------------
    ssl_certificate     /etc/letsencrypt/live/linli.lzbdcxm.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/linli.lzbdcxm.cn/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # ------------------------------------------------------------------
    # 传输压缩：实测 community-*.js 200 192 B → 62 690 B（−68.7%）
    # 站点产物合计 781 KB（`du` 口径为 848 KB，含块对齐，勿混用）
    # ------------------------------------------------------------------
    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_comp_level   6;
    gzip_types        text/plain text/css text/javascript
                      application/javascript application/json
                      application/xml image/svg+xml;

    # ------------------------------------------------------------------
    # 安全响应头（server 级默认值）
    # 注意：nginx 的 add_header 不继承——下方任何一个 location 只要自己
    # 出现了 add_header，就会整体丢弃这里的安全头。因此：
    #   · html 分支：完整重复全部 6 项（文档型响应，全部有意义）
    #   · /assets/ 分支：只重复 2 项（nosniff + 缓存控制）。
    #     X-Frame-Options / Permissions-Policy / HSTS 只对文档生效，对
    #     JS/CSS 无效；X-Robots-Tag 同理，故有意省略，不是漏写。
    # HSTS 仅在该 443 块下发：HTTP 响应上的 HSTS 会被客户端忽略，
    # 放在 80 块只会污染配置。未加 includeSubDomains，避免波及同级子域。
    # ------------------------------------------------------------------
    add_header Strict-Transport-Security "max-age=31536000"             always;
    add_header X-Content-Type-Options "nosniff"                        always;
    add_header X-Frame-Options        "SAMEORIGIN"                     always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy     "camera=(), microphone=(), geolocation=()" always;
    add_header X-Robots-Tag           "noindex, nofollow, noarchive"    always;

    # ------------------------------------------------------------------
    # 隐藏文件拦截（.git / .env / .DS_Store 等）
    # 必须排在下面的 html 正则之前，否则 /.git/x.html 会先命中 html 分支。
    # ------------------------------------------------------------------
    location ~ /\.(?!well-known) {
        deny all;
        access_log off;
    }

    # ------------------------------------------------------------------
    # 两个入口 HTML：禁止缓存
    # 用 must-revalidate 而非 no-store，允许 304 协商，省带宽且保证新鲜度。
    # ------------------------------------------------------------------
    location ~* \.html$ {
        add_header Cache-Control "no-cache, must-revalidate"            always;
        add_header Strict-Transport-Security "max-age=31536000"         always;
        add_header X-Content-Type-Options "nosniff"                     always;
        add_header X-Frame-Options        "SAMEORIGIN"                  always;
        add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy     "camera=(), microphone=(), geolocation=()" always;
        add_header X-Robots-Tag           "noindex, nofollow, noarchive" always;

        try_files $uri =404;
    }

    # ------------------------------------------------------------------
    # 带内容哈希的静态资源：一年 immutable
    # 资源名变了就意味着内容变了，因此不需要任何重新验证请求。
    # ------------------------------------------------------------------
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable"  always;
        add_header X-Content-Type-Options "nosniff"                     always;

        access_log off;
        try_files $uri =404;
    }

    # ------------------------------------------------------------------
    # 后端骨架反代：/api/ → 127.0.0.1:3000
    # 后端只监听回环地址，公网唯一入口就是这里；systemd 单元 linli-api.service。
    # proxy_pass 不带 URI，保留 /api 前缀原样转发，后端按 /api/xxx 路由。
    # 本 location 不写 add_header，从而继承 server 级安全头（含 HSTS）——
    # 一旦在这里加任何 add_header，server 级那 6 项会整组丢失。
    # ------------------------------------------------------------------
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;
        proxy_send_timeout    30s;
    }

    # ------------------------------------------------------------------
    # 根路径：内部重写到 index.html
    # 用 rewrite ... last 而非 try_files，是为了让请求重新进入上面的
    # html 分支，从而拿到 no-cache 头。直接 try_files /index.html 会
    # 走 server 级安全头，Cache-Control 就丢了。
    # ------------------------------------------------------------------
    location = / {
        rewrite ^ /index.html last;
    }

    # ------------------------------------------------------------------
    # 其余请求：静态文件直出，缺失即 404
    # ------------------------------------------------------------------
    location / {
        try_files $uri $uri/ =404;
    }
}
