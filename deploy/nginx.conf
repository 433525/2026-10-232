# ============================================================================
# 暖阳邻里 · 静态站点 Nginx 配置
# ----------------------------------------------------------------------------
# 适用：Nginx >= 1.18（Debian/Ubuntu 的 nginx 包或 RHEL 系均可）
# 落盘：/etc/nginx/conf.d/linli.conf
# 生效：sudo nginx -t && sudo systemctl reload nginx
#
# 与构建产物强相关的前提（改动前请先读懂，否则会出现白屏或版本不生效）：
#
#   1. vite.config.ts 未设置 base，产物引用绝对路径 /assets/*。
#      => 站点必须部署在域名根目录。若必须放子目录（如 /linli/），
#         需先在 vite.config.ts 增加 base: "/linli/" 并重新构建。
#   2. 双入口：index.html（B 端）、aplus.html（A+ 端），两者文件名都不含哈希。
#      => 必须 no-cache，否则发版后用户仍拿到旧 HTML，指向已被删除的旧 chunk。
#   3. /assets/* 文件名含内容哈希（如 community-UgQB5uMf.js）。
#      => 可安全使用 1 年 immutable 缓存，发版无需换名。
#   4. 路由全部走查询串（?tab=community&post=<id>），不使用 history 路由。
#      => 不需要 SPA fallback 重写。任何形如 try_files $uri /index.html 的
#         兜底都会把 404 伪装成 200，反而掩盖真实错误，故此处刻意不写。
#   5. 本项目为合成数据演练原型，HTML 已含 meta robots=noindex，
#      public/robots.txt 为第二道闸门；此处 X-Robots-Tag 为第三道。
# ============================================================================

server {
    listen      80;
    listen      [::]:80;
    server_name linli.example.com;          # ← 改成你的域名或公网 IP

    root  /var/www/linli;                   # ← 改成实际站点根目录
    index index.html;
    charset utf-8;

    access_log /var/log/nginx/linli.access.log;
    error_log  /var/log/nginx/linli.error.log warn;

    # ------------------------------------------------------------------
    # 传输压缩：实测 community-*.js 200 192 B → 62 690 B（−68.7%）
    # 站点产物合计 781 KB（`du` 口径为 848 KB，含块对齐，勿混用）
    # ------------------------------------------------------------------
    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_comp_level   6;
    gzip_types        text/plain text/css text/javascript
                      application/javascript application/json
                      application/xml image/svg+xml;

    # ------------------------------------------------------------------
    # 安全响应头（server 级默认值）
    # 注意：nginx 的 add_header 不继承——下方任何一个 location 只要自己
    # 出现了 add_header，就会整体丢弃这里的安全头。因此：
    #   · html 分支：完整重复全部 5 项（文档型响应，全部有意义）
    #   · /assets/ 分支：只重复 2 项（nosniff + 缓存控制）。
    #     X-Frame-Options / Permissions-Policy 只对文档生效，对 JS/CSS
    #     无效；X-Robots-Tag 同理，故有意省略，不是漏写。
    # ------------------------------------------------------------------
    add_header X-Content-Type-Options "nosniff"                        always;
    add_header X-Frame-Options        "SAMEORIGIN"                     always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy     "camera=(), microphone=(), geolocation=()" always;
    add_header X-Robots-Tag           "noindex, nofollow, noarchive"    always;

    # ------------------------------------------------------------------
    # ACME 校验放行（走 certbot 申请证书时必需）
    # 若不使用 certbot 的 webroot 模式，可整块删除。
    # ------------------------------------------------------------------
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        access_log off;
    }

    # ------------------------------------------------------------------
    # 隐藏文件拦截（.git / .env / .DS_Store 等）
    # 必须排在下面的 html 正则之前，否则 /.git/x.html 会先命中 html 分支。
    # ------------------------------------------------------------------
    location ~ /\.(?!well-known) {
        deny all;
        access_log off;
    }

    # ------------------------------------------------------------------
    # 两个入口 HTML：禁止缓存
    # 用 must-revalidate 而非 no-store，允许 304 协商，省带宽且保证新鲜度。
    # ------------------------------------------------------------------
    location ~* \.html$ {
        add_header Cache-Control "no-cache, must-revalidate"            always;
        add_header X-Content-Type-Options "nosniff"                     always;
        add_header X-Frame-Options        "SAMEORIGIN"                  always;
        add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy     "camera=(), microphone=(), geolocation=()" always;
        add_header X-Robots-Tag           "noindex, nofollow, noarchive" always;

        try_files $uri =404;
    }

    # ------------------------------------------------------------------
    # 带内容哈希的静态资源：一年 immutable
    # 资源名变了就意味着内容变了，因此不需要任何重新验证请求。
    # ------------------------------------------------------------------
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable"  always;
        add_header X-Content-Type-Options "nosniff"                     always;

        access_log off;
        try_files $uri =404;
    }

    # ------------------------------------------------------------------
    # 根路径：内部重写到 index.html
    # 用 rewrite ... last 而非 try_files，是为了让请求重新进入上面的
    # html 分支，从而拿到 no-cache 头。直接 try_files /index.html 会
    # 走 server 级安全头，Cache-Control 就丢了。
    # ------------------------------------------------------------------
    location = / {
        rewrite ^ /index.html last;
    }

    # ------------------------------------------------------------------
    # 其余请求：静态文件直出，缺失即 404
    # ------------------------------------------------------------------
    location / {
        try_files $uri $uri/ =404;
    }
}

# ============================================================================
# HTTPS（可选，二选一）
# ----------------------------------------------------------------------------
# 方案 A（推荐）：用 certbot 自动改写，不要手写证书路径
#   sudo apt install -y certbot python3-certbot-nginx
#   sudo certbot --nginx -d linli.example.com
#   certbot 会自动插入 443 server 块、80→443 跳转与续期定时器。
#
# 方案 B：手工维护（已有证书文件时用）
#   server {
#       # 1.18 / 1.24 必须把 http2 写在 listen 里；1.25.1+ 才支持独立的 http2 on;
#       listen 443 ssl http2;
#       listen [::]:443 ssl http2;
#       server_name linli.example.com;
#
#       ssl_certificate     /etc/letsencrypt/live/linli.example.com/fullchain.pem;
#       ssl_certificate_key /etc/letsencrypt/live/linli.example.com/privkey.pem;
#       ssl_protocols       TLSv1.2 TLSv1.3;
#       ssl_ciphers         HIGH:!aNULL:!MD5;
#       ssl_session_cache   shared:SSL:10m;
#       ssl_session_timeout 1d;
#
#       # 其余 root / gzip / location 内容与上面 80 块完全一致，
#       # 建议用 include 抽公共片段，避免两份配置漂移。
#   }
#
#   并在 80 块内加一条跳转：
#   location / { return 301 https://$host$request_uri; }
#   （注意这会连带 ACME 校验一起跳走，需把 .well-known 块放在跳转之前，
#     或改用 DNS-01 校验。）
# ============================================================================
